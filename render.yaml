services:
  - type: web
    name: schemesathi-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: schemesathi-postgres
          property: connectionString
      - key: QDRANT_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: schemesathi-postgres
    databaseName: schemesathi
    user: postgres
